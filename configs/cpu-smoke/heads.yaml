# CPU smoke preset: finishes in about a minute on a laptop CPU; runs in CI.
# Synthetic data (no recordings, no people) is generated and prepared into the shared cache on first use.
task: heads
seed: 0
device: auto
threads: 2
data:
  cache: runs/cpu-smoke/cache
  synthetic: {n_singers: 6, seconds: 1.2}
  prepare: {sr: 22050, hop: 256, separation: "off", features: [dsp]}
  split: {train: 0.6, val: 0.2, test: 0.2}
  crop_frames: [32, 64]
  batch_size: 4
optim: {lr: 3.0e-3, grad_accum: 2, grad_clip: 1.0, schedule: constant, betas: [0.9, 0.99]}
run: {out: runs/cpu-smoke/heads, max_steps: 40, val_every: 10, save_every: 10, log_every: 5, patience: 4}
model: {features: dsp, hidden: 32}
components: {heads: scratch}
