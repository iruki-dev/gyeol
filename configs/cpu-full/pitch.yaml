# Long unattended CPU run: RMVPE (measured ~9 s/step on 4 CPU threads → 60k steps ≈ 6 days).  Targets are the consensus pitch cached by gyeol prepare (pseudo-labels);
# fine-tune from the reference weights (`gyeol fetch rmvpe`, Apache-2.0) instead of training from scratch.
task: pitch
seed: 0
profile: commercial
device: auto
threads: 0
data:
  cache: runs/cpu-full/cache
  manifests: []
  prepare: {sr: 44100, hop: 512, separation: auto, features: [dsp]}
  split: {train: 0.8, val: 0.1, test: 0.1}
  crop_frames: [96, 192]
  batch_size: 8
  num_workers: 2
optim: {lr: 2.0e-4, grad_accum: 2, grad_clip: 1.0, schedule: cosine, warmup_steps: 1000, betas: [0.9, 0.99]}
run: {out: runs/cpu-full/pitch, max_steps: 60000, val_every: 2000, save_every: 500, log_every: 50, patience: 10, val_batches: 50}
model: {size: full, target_sigma_cents: 25}
components: {pitch: finetune}
init: {pitch: {path: ~/.cache/gyeol/rmvpe/rmvpe.pt, asset: rmvpe}}
checkpointing: [pitch]
