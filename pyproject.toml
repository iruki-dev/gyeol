[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gyeol"
version = "2.0.0.dev0"
description = "Interpretable singing-voice model for Korean vocal coaching: attribute curves, time-warp explanations and consent-gated own-voice demos"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "iruki-dev" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "soundfile>=0.12"]

[project.optional-dependencies]
separation = []          # adapters load user-installed separators; see gyeol.frontend.separation
ssl = ["torchaudio>=2.2"]   # BSD-2: HuBERT / WavLM architectures; weights from locally fetched checkpoints (M3, B2)
korean = ["g2pk"]
train = ["pyyaml>=6", "torchaudio>=2.2"]   # MIT / BSD-2: YAML run configs, SSL fine-tuning (revision B)
dev = ["pytest>=7", "ruff>=0.4"]
onnx = ["onnx>=1.16", "onnxscript>=0.2", "onnxruntime>=1.17"]   # Apache-2.0 / MIT / MIT: server export (M8)

[project.scripts]
gyeol = "gyeol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gyeol = ["resources/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B905", "B008", "I001"]
